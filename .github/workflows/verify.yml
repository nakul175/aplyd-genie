name: Verify Genie
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --omit=dev --audit-level=moderate
  postgres-memberships:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine@sha256:1bcc18d81671b02906296aad470ec9778a6b71016ce953092024b680bad007b0
        env:
          POSTGRES_USER: genie_test_owner
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: genie_qual_memberships
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U genie_test_owner -d genie_qual_memberships"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test --test-concurrency=1 tests/memberships.test.mjs tests/permissions.test.mjs tests/workspaces.test.mjs
        env:
          GENIE_TEST_DATABASE_URL: postgresql://genie_test_owner:synthetic-ci-only@127.0.0.1:5432/genie_qual_memberships

  postgres-portal-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine@sha256:1bcc18d81671b02906296aad470ec9778a6b71016ce953092024b680bad007b0
        env:
          POSTGRES_USER: genie_test_owner
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: genie_qual_portal_bridge
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U genie_test_owner -d genie_qual_portal_bridge"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test --test-concurrency=1 tests/portal-membership.test.mjs
        env:
          GENIE_TEST_DATABASE_URL: postgresql://genie_test_owner:synthetic-ci-only@127.0.0.1:5432/genie_qual_portal_bridge

  postgres-portal-roles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine@sha256:1bcc18d81671b02906296aad470ec9778a6b71016ce953092024b680bad007b0
        env:
          POSTGRES_USER: genie_test_owner
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: genie_qual_portal_roles
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U genie_test_owner -d genie_qual_portal_roles"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test --test-concurrency=1 tests/portal-roles.test.mjs
        env:
          GENIE_TEST_DATABASE_URL: postgresql://genie_test_owner:synthetic-ci-only@127.0.0.1:5432/genie_qual_portal_roles
