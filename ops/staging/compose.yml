name: aplyd-genie-staging
services:
  database:
    image: postgres:17-alpine@sha256:1bcc18d81671b02906296aad470ec9778a6b71016ce953092024b680bad007b0
    env_file: /opt/aplyd-genie-staging/private/database.env
    restart: unless-stopped
    ports: ['127.0.0.1:5547:5432']
    volumes: ['genie_database:/var/lib/postgresql/data']
    shm_size: 128mb
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U genie_migrator -d genie_staging']
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options: { max-size: '5m', max-file: '2' }
  app:
    image: node:24-bookworm-slim@sha256:01d566e8d94d8c619591d78652babfccd3c6992a3dffa9ed5ab39e11cf6c70e9
    user: '1000:1000'
    network_mode: host
    working_dir: /app
    command: ['node', 'src/server.mjs']
    env_file: /opt/aplyd-genie-staging/private/runtime.env
    volumes: ['/opt/aplyd-genie-staging/current:/app:ro']
    read_only: true
    tmpfs: ['/tmp:size=16m,noexec,nosuid']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 96
    depends_on:
      database: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: '5m', max-file: '2' }
volumes:
  genie_database:
